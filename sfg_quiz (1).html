<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SFG — StillFellGay</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--pink:#E91E8C;--pink-light:#FF6EC7;--yellow:#FFE227;--purple:#7B2FBE;--dark:#0E0812;--white:#FFF9FE}
body{background:var(--dark);color:var(--white);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(140px);opacity:0.18;pointer-events:none;z-index:0}
.blob-1{width:600px;height:600px;background:var(--pink);top:-250px;left:-150px}
.blob-2{width:500px;height:500px;background:var(--purple);bottom:-150px;right:-100px}
.blob-3{width:280px;height:280px;background:var(--yellow);top:40%;left:55%}
.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:1.2rem 2rem;border-bottom:1px solid rgba(255,255,255,0.07)}
.logo{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:.12em;background:linear-gradient(90deg,var(--pink-light),var(--yellow));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-sub{font-family:'Instrument Serif',serif;font-style:italic;font-size:.7rem;display:block;-webkit-text-fill-color:rgba(255,255,255,.3);background:none;margin-top:-4px}
.badge{background:var(--pink);color:#fff;font-size:.65rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;padding:.3rem .8rem;border-radius:999px}
.screen{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.5rem;text-align:center}
.screen.active{display:flex}
/* INTRO */
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(3.5rem,14vw,9rem);line-height:.88;letter-spacing:.04em;background:linear-gradient(135deg,#fff 0%,var(--pink-light) 50%,var(--yellow) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:1rem}
.hero-sub{font-family:'Instrument Serif',serif;font-style:italic;font-size:1.1rem;color:rgba(255,255,255,.45);margin-bottom:2.5rem;max-width:380px}
.start-btn{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:.12em;background:var(--pink);color:#fff;border:none;border-radius:14px;padding:1rem 3rem;cursor:pointer;transition:background .2s,transform .1s}
.start-btn:hover{background:#d4177a;transform:scale(1.02)}
/* QUIZ */
#quiz-screen{justify-content:flex-start;padding-top:1.5rem}
.quiz-inner{width:100%;max-width:520px;margin:0 auto}
.progress-wrap{width:100%;height:4px;background:rgba(255,255,255,.08);border-radius:2px;margin-bottom:1.5rem}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--yellow));border-radius:2px;transition:width .4s ease}
.q-counter{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:1rem;text-align:center}
.photo-wrap{width:100%;max-width:300px;margin:0 auto 1.2rem;border-radius:16px;overflow:hidden;border:2px solid rgba(255,255,255,.08);aspect-ratio:3/4;background:rgba(255,255,255,.03);display:flex;align-items:center;justify-content:center}
.photo-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.q-caption{font-family:'Instrument Serif',serif;font-style:italic;font-size:.88rem;color:rgba(255,255,255,.3);margin-bottom:.6rem;text-align:center}
.q-text{font-family:'Bebas Neue',sans-serif;font-size:1.7rem;letter-spacing:.05em;color:var(--white);margin-bottom:1.4rem;line-height:1.15;text-align:center}
.choices{display:flex;flex-direction:column;gap:.65rem;width:100%}
.choice-btn{background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1);color:var(--white);font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:500;padding:.85rem 1.2rem;border-radius:12px;cursor:pointer;transition:all .15s;text-align:left;display:flex;align-items:center;gap:.75rem;width:100%}
.choice-btn:hover{border-color:var(--pink-light);background:rgba(233,30,140,.08)}
.choice-btn.correct{border-color:#00e676;background:rgba(0,230,118,.1);color:#00e676;pointer-events:none}
.choice-btn.wrong{border-color:#ff1744;background:rgba(255,23,68,.08);color:#ff5252;pointer-events:none;opacity:.6}
.choice-btn.neutral{border-color:rgba(255,255,255,.05);background:rgba(255,255,255,.02);color:rgba(255,255,255,.25);pointer-events:none}
.dot{width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.68rem;font-weight:700}
.feedback{margin-top:1rem;font-size:.88rem;min-height:1.3rem;font-style:italic;text-align:center}
.next-btn{margin-top:1.2rem;font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:.1em;background:var(--pink);color:#fff;border:none;border-radius:12px;padding:.8rem 2.5rem;cursor:pointer;display:none;transition:background .2s,transform .1s;width:100%}
.next-btn:hover{background:#d4177a;transform:scale(1.01)}
/* RESULT */
.big-verdict{font-family:'Bebas Neue',sans-serif;font-size:clamp(4rem,20vw,9rem);line-height:.9;letter-spacing:.06em;background:linear-gradient(135deg,var(--pink-light),var(--yellow));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.75rem}
.score-line{font-size:1rem;color:rgba(255,255,255,.4);margin-bottom:2rem}
.score-num{font-family:'Bebas Neue',sans-serif;font-size:2.5rem;color:var(--pink-light)}
.result-sub{font-family:'Instrument Serif',serif;font-style:italic;font-size:1.05rem;color:rgba(255,255,255,.4);max-width:360px;margin-bottom:2.5rem;line-height:1.6}
.replay-btn{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:.1em;background:none;border:2px solid var(--pink);color:var(--pink);padding:.8rem 2.5rem;border-radius:12px;cursor:pointer;transition:all .2s}
.replay-btn:hover{background:var(--pink);color:#fff}
</style>
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>
<div class="page">
  <header>
    <div class="logo">SFG<span class="logo-sub">StillFellGay™</span></div>
    <div class="badge">🔬 Science-Based™</div>
  </header>

  <div class="screen active" id="intro-screen">
    <div class="hero-title">MATHEO<br>EST-IL<br>GAY ?</div>
    <div class="hero-sub">Le test scientifique ultime. Réponds aux questions et découvre la vérité.</div>
    <button class="start-btn" id="start-btn">🏳️‍🌈 COMMENCER LE TEST</button>
  </div>

  <div class="screen" id="quiz-screen">
    <div class="quiz-inner">
      <div class="progress-wrap"><div class="progress-fill" id="pfill" style="width:0%"></div></div>
      <div class="q-counter" id="qcount">Question 1 / 19</div>
      <div class="photo-wrap" id="pwrap" style="display:none"><img id="qphoto" src="" alt=""/></div>
      <div class="q-caption" id="qcaption"></div>
      <div class="q-text" id="qtext"></div>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="next-btn">SUIVANT →</button>
    </div>
  </div>

  <div class="screen" id="result-screen">
    <div class="big-verdict">GAY.</div>
    <div class="score-line">Score de gayitude : <span class="score-num" id="score-display">0</span> pts</div>
    <div class="result-sub" id="result-msg"></div>
    <button class="replay-btn" id="replay-btn">🔄 REJOUER</button>
  </div>
</div>

const LABELS = ['A','B','C'];
let questions = [], current = 0, score = 0;

function shuffle(a) {
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function buildQuestions() {
  const all = [];
  PQ.forEach(pq => all.push({type:'photo', img: IMGS[pq.img], caption: pq.caption, q: pq.q, choices: pq.choices, answer: pq.answer}));
  TQ.forEach(tq => all.push({type:'text', q: tq.q, choices: tq.choices, answer: tq.answer}));
  return shuffle(all);
}

function startQuiz() {
  questions = buildQuestions();
  current = 0;
  score = 0;
  showScreen('quiz-screen');
  render();
}

function render() {

  document.getElementById('feedback').style.color = '';
  document.getElementById('next-btn').style.display = 'none';

  const pw = document.getElementById('pwrap');
  const cap = document.getElementById('qcaption');
  if (q.type === 'photo') {
    document.getElementById('qphoto').src = q.img;
    pw.style.display = 'flex';
    cap.textContent = q.caption;
  } else {
    pw.style.display = 'none';
    cap.textContent = '';
  }
  document.getElementById('qtext').textContent = q.q;

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  q.choices.forEach(function(c, i) {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = '<span class="dot">' + LABELS[i] + '</span>' + c;
    btn.addEventListener('click', function() { pick(c, q.answer); });
    choicesEl.appendChild(btn);
  });
}

function pick(chosen, answer) {
  const btns = document.querySelectorAll('.choice-btn');
  const fb = document.getElementById('feedback');
  const ok = chosen === answer;
  if (ok) score += 10;

  btns.forEach(function(btn) {
    const txt = btn.textContent.slice(1);
    if (txt === answer) btn.classList.add('correct');
    else if (txt === chosen) btn.classList.add('wrong');
    else btn.classList.add('neutral');
  });

  if (ok) {
    const msgs = ['Exactement ! 🎯','Bien vu ! ✨','La science approuve 🔬','Évident non ? 😏'];
    fb.textContent = msgs[Math.floor(Math.random()*msgs.length)];
    fb.style.color = '#00e676';
  } else {
    fb.textContent = 'Raté ! Bonne réponse : ' + answer + ' 😬';
    fb.style.color = '#ff5252';
  }
  document.getElementById('next-btn').style.display = 'block';
}

document.getElementById('next-btn').addEventListener('click', function() {
  current++;
  if (current >= questions.length) showResult();
  else render();
});

function showResult() {
  document.getElementById('score-display').textContent = score;
  const pct = score / (questions.length * 10);
  let msg;
  if (pct >= 0.85) msg = 'Score parfait. Matheo est cliniquement, scientifiquement, universellement GAY. 🏳️‍🌈';
  else if (pct >= 0.6) msg = 'Résultat sans surprise. Les capteurs confirment : GAY.';
  else msg = 'Tu as eu du mal… mais la vérité reste la même : Matheo est GAY. 🔬';
  document.getElementById('result-msg').textContent = msg;
  showScreen('result-screen');
}

document.getElementById('start-btn').addEventListener('click', startQuiz);
document.getElementById('replay-btn').addEventListener('click', function() { showScreen('intro-screen'); });
</script>
</body>
